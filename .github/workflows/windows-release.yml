name: Windows Release Packages (Phase 15)

# On EVERY PR and every push to main, test BEFORE publishing the genuine WPF executable and producing BOTH
# artifacts for EACH architecture (Portable ZIP + Inno Setup installer), verifies runtime
# dependencies and emits SHA-256 checksums + build metadata.
# Publishing a GitHub Release is intentionally NOT done here: 15.08 requires the
# explicit owner approval under Phase 15.08; this workflow only uploads CI
# artifacts for review. No code signing occurs unless the owner provisions the
# approved certificate secrets (see "Optional signing" step); unsigned builds
# are never labeled 'secure'.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.15.0)'
        required: true
        default: '0.15.0'
  push:
    branches: ['main']
    tags: ['v*']
  # No path filtering: documentation, domain, auth, workflow and test changes
  # all require the exact same full pre-merge Release test + packaging gate.
  pull_request:

# Only the newest revision of a branch needs a build. Avoid CI overload when
# successive implementation commits land; the final commit still builds fully.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  CONFIGURATION: Release
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.{0}-ci', github.run_number)) }}
  # PR builds test github.sha (synthetic merge ref), but record the source PR head independently.
  ALTAMAM_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Manifest & advisory preflight (15.01 / 14.01 carry-over)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Action-manifest security guard (CSP, RBAC drift)
        run: python build/manifest-guard.py
      - name: Validate Arabic navigation and JavaScript syntax
        shell: pwsh
        run: |
          python build/validate-ui-shell.py
          if ($LASTEXITCODE -ne 0) { throw 'UI shell contract failed' }
          python build/test-ci-exit-guards.py
          if ($LASTEXITCODE -ne 0) { throw 'Section 05 CI exit-code guard failed' }
          python build/test-ci-performance-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Section 05 CI optimization safety guard failed' }
          python build/test-release-artifact-provenance.py
          if ($LASTEXITCODE -ne 0) { throw 'Section 05 release SHA-256 provenance regression failed' }
          python build/test-webview-selfcheck-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows real WebView2 smoke-test contract failed' }
          foreach ($file in @('altamam-app.js', 'bridge-client.js', 'screen-module.js', 'functional-screens.js', 'admin-settings.js', 'attendance-ui.js', 'personnel-movements.js', 'personnel-separation.js', 'personnel-report.js', 'table-experience.js')) {
            node --check "src/AlTamam.WebUI/assets/js/$file"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $file" }
          }
      - name: Test administration drill-down and settings safeguards
        shell: pwsh
        run: |
          node build/test-bridge-operation-intents.js
          if ($LASTEXITCODE -ne 0) { throw 'Bridge mutation intent regression' }
          node build/test-audit-route-visibility.js
          if ($LASTEXITCODE -ne 0) { throw 'Audit route RBAC regression' }
          node build/test-readonly-route-states.js
          if ($LASTEXITCODE -ne 0) { throw 'Phase 04 authenticated route/state regression' }
          node build/test-route-return-link-honesty.js
          if ($LASTEXITCODE -ne 0) { throw 'Section 05 route link honesty regression' }
          node build/test-admin-settings-navigation.js
          if ($LASTEXITCODE -ne 0) { throw 'Admin/settings UI regression' }
          node build/test-excel-import-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Excel personnel import UI regression' }
          node build/test-monthly-excel-export.js
          if ($LASTEXITCODE -ne 0) { throw 'Monthly native Excel UI regression' }
          node build/test-monthly-cell-details.js
          if ($LASTEXITCODE -ne 0) { throw 'Monthly cell details UI regression' }
          node build/test-attendance-drafts.js
          if ($LASTEXITCODE -ne 0) { throw 'Attendance draft UI regression' }
          node build/test-dashboard-counter-filters.js
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard counter filter UI regression' }
          node build/test-dashboard-route-navigation.js
          if ($LASTEXITCODE -ne 0) { throw 'Section 05 Dashboard route navigation regression' }
          node build/test-attendance-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Attendance UI smoke failed' }
          node build/test-table-experience.js
          if ($LASTEXITCODE -ne 0) { throw 'Global tables and search usability regression' }
          node build/test-personnel-movements.js
          if ($LASTEXITCODE -ne 0) { throw 'Admin/settings navigation regression' }
          node build/test-session-idle.js
          if ($LASTEXITCODE -ne 0) { throw '5-minute session inactivity regression' }
          node build/test-operation-dialogs.js
          if ($LASTEXITCODE -ne 0) { throw "Centered operation dialog regression" }
          node build/test-modal-first-design.js
          if ($LASTEXITCODE -ne 0) { throw "Modal-first UI contract regression" }
          node build/test-personnel-separation.js
          if ($LASTEXITCODE -ne 0) { throw 'Personnel separation UI regression' }
          node build/test-personnel-report-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Unified individual/group report UI regression' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore with package integrity + advisory audit
        shell: pwsh
        run: |
          dotnet restore AlTamam.slnx; if ($LASTEXITCODE -ne 0) { throw 'restore failed' }
          dotnet list AlTamam.slnx package --vulnerable --include-transitive | Tee-Object vulnerable.txt
          if ($LASTEXITCODE -ne 0) { throw 'vulnerability scan command failed' }
          if (Select-String -Path vulnerable.txt -SimpleMatch 'has an easily accessible vulnerability') {
            throw 'ADVISORY GATE FAILED: transitive package vulnerability present'
          }

  build-test:
    name: Build + full test suite on Windows x64 (15.01)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore / Build
        run: |
          dotnet restore AlTamam.slnx
          dotnet build AlTamam.slnx -c $env:CONFIGURATION --no-restore
      # NOTE (2026-10-23 §22 audit): the previous category-filtered steps (--filter
      # "Category=Unit|Persistence|Security|Performance") were a SILENT NO-OP: zero test
      # files declare any Trait/Category today, so those filters matched nothing while
      # `dotnet test` still exited 0 — exactly the false-green this contract forbids.
      # Until categories are declared on the tests themselves, run the FULL suite.
      - name: Phase 02 SQLCipher and temporal-history integration suite (mandatory before packaging)
        run: >
          dotnet test tests/AlTamam.IntegrationTests/AlTamam.IntegrationTests.csproj -c $env:CONFIGURATION --no-build --no-restore
          --logger "trx;LogFileName=phase02-integration.trx" --results-directory TestResults
      - name: Phase 03 independent authorization unit suite
        run: >
          dotnet test tests/AlTamam.UnitTests/AlTamam.UnitTests.csproj -c $env:CONFIGURATION --no-build --no-restore
          --logger "trx;LogFileName=phase03-unit.trx" --results-directory TestResults
      - name: Full deterministic test suite (all authored tests; unit+persistence+security+bridge+performance)
        run: >
          dotnet test tests/AlTamam.Tests/AlTamam.Tests.csproj -c $env:CONFIGURATION --no-build --no-restore
          --logger "trx;LogFileName=full-suite.trx" --results-directory TestResults
      - name: Guard both test projects against zero-tests-executed
        shell: pwsh
        run: |
          foreach ($file in @('TestResults/full-suite.trx', 'TestResults/phase02-integration.trx', 'TestResults/phase03-unit.trx')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Required test report missing: $file" }
            $xml = [xml](Get-Content -LiteralPath $file)
            $count = [int]$xml.TestRun.ResultSummary.Counters.total
            Write-Host "Tests executed ($file): $count"
            if ($count -lt 1) { throw "TEST SUITE RAN 0 TESTS: $file" }
            if ($file -like '*phase02*' -and $count -lt 8) {
              throw 'Phase 02 integration suite is incomplete'
            }
            if ($file -like '*phase03*' -and $count -lt 4) {
              throw 'Phase 03 unit suite is incomplete'
            }
          }
      - name: Real WPF/WebView2 RTL/modal interaction E2E (pre-package, Windows)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./build/test-webview-ui-e2e.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows WebView2 UI E2E failed before packaging' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults/*.trx
          if-no-files-found: error

  package:
    # HARD DEPENDENCY: no test success => no Portable/Installer output.
    name: Publish and package (${{ matrix.arch }}) after tests
    needs: build-test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Windows-64bit
            runtime: win-x64
          - arch: Windows-32bit
            runtime: win-x86
    env:
      # win-x86 is the .NET runtime identifier for REAL 32-bit Windows.
      # Customer-facing package names are ONLY Windows-32bit / Windows-64bit.
      RUNTIME: ${{ matrix.runtime }}
      DISPLAY_ARCH: ${{ matrix.arch }}
      PUBLISH_DIR: publish/AlTamam-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: Directory.Packages.props
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Stage and verify offline Cairo and Tajawal fonts
        shell: pwsh
        run: |
          ./build/prepare-offline-fonts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Offline font preparation failed' }
      - name: Publish genuine WPF executable (self-contained, ${{ matrix.arch }})
        run: >
          dotnet publish src/AlTamam.DesktopHost/AlTamam.DesktopHost.csproj
          -c $env:CONFIGURATION -r $env:RUNTIME --self-contained true
          -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false
          -o $env:PUBLISH_DIR
      - name: Remove WebView2 XML API documentation from distribution only
        shell: pwsh
        run: |
          # Generated API reference files are not required by WebView2 at runtime.
          # Keep DLLs, native loaders, application XML assets, and all other files.
          Get-ChildItem -LiteralPath $env:PUBLISH_DIR -File -Filter 'Microsoft.Web.WebView2.*.xml' |
            Remove-Item -Force
      - name: Bundle Microsoft's genuine WebView2 standalone OFFLINE installer
        shell: pwsh
        run: |
          $uri = if ($env:RUNTIME -eq 'win-x86') {
            'https://go.microsoft.com/fwlink/?linkid=2099617'
          } else {
            'https://go.microsoft.com/fwlink/?linkid=2124701'
          }
          $dir = Join-Path $env:PUBLISH_DIR 'Prerequisites'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $file = Join-Path $dir 'MicrosoftEdgeWebView2RuntimeInstaller.exe'
          Invoke-WebRequest -Uri $uri -OutFile $file -MaximumRedirection 10
          if ((Get-Item $file).Length -lt 50000000) {
            throw 'Offline WebView2 installer is missing or unexpectedly small'
          }
          $sig = Get-AuthenticodeSignature -FilePath $file
          if ($sig.Status -ne 'Valid' -or
              $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "WebView2 Microsoft Authenticode verification failed: $($sig.Status)"
          }
          $digest=(Get-FileHash $file -Algorithm SHA256).Hash
          Write-Host "MICROSOFT OFFLINE WEBVIEW2: verified $env:RUNTIME SHA256=$digest"
      - name: Validate publish layout (real PE, WebView2 loader, SQLCipher native)
        run: python build/validate-layout.py $env:PUBLISH_DIR --portable --arch $env:RUNTIME
      - name: Optional signing (ONLY with owner-provisioned approved certificate)
        shell: pwsh
        env:
          SMTOOL_USER: ${{ secrets.SMTOOL_USER }}
          SMTOOL_AUTH: ${{ secrets.SMTOOL_AUTH }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            Write-Host "Signing disabled for PR validation; production signing requires owner approval."
          } elseif ($env:SMTOOL_USER) {
            # Real certificate comes exclusively from owner-approved secrets;
            # never embedded in the repository. Absent => artifact stays UNSIGNED
            # and release notes must not claim signature/'secure' distribution.
            choco install sigclient2 -y --version 2.1.0
            java -jar "$env:GITHUB_WORKSPACE/build/sigclient2.jar" `
              -user $env:SMTOOL_USER -auth $env:SMTOOL_AUTH `
              -r http://timestamp.digicert.com -td SHA-256 -fd SHA-256 `
              -in "$env:PUBLISH_DIR\AlTamam.DesktopHost.exe" `
              -sw -debug -verbose
          } else { Write-Host "SIGNING SKIPPED: no approved certificate provisioned (unsigned != secure)." }
      - name: Smoke-run headless checks on runner (15.06 partial, real machine evidence below)
        shell: pwsh
        run: |
          # Executable actually launches; WPF UI loop can't be asserted headlessly,
          # so we verify process start + clean exit via the built-in self-check flag.
          & "$env:PUBLISH_DIR\AlTamam.DesktopHost.exe" --layout-selfcheck
      - name: Verify WebView2 loads the bundled offline UI on Windows
        shell: pwsh
        run: |
          $exe = (Resolve-Path "$env:PUBLISH_DIR\AlTamam.DesktopHost.exe").Path
          $workingDirectory = (Resolve-Path $env:PUBLISH_DIR).Path
          $passed = $false
          # Fresh isolated browser profiles are created by the host for every
          # attempt. A bounded second attempt handles transient runner/browser
          # startup only; real navigation is mandatory and failures remain red.
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $env:ALTAMAM_WEBVIEW_SELFCHECK_TRACE = Join-Path $env:RUNNER_TEMP "altamam-webview-${env:RUNTIME}-attempt-$attempt.log"
            Remove-Item -LiteralPath $env:ALTAMAM_WEBVIEW_SELFCHECK_TRACE -Force -ErrorAction SilentlyContinue
            Write-Host "Starting REAL offline WebView2 navigation ($env:RUNTIME, attempt $attempt of 2)"
            $probe = Start-Process -FilePath $exe -ArgumentList '--webview-selfcheck' `
              -WorkingDirectory $workingDirectory -PassThru
            $exited = $probe.WaitForExit(60000)
            if (-not $exited) {
              Write-Warning "WebView2 startup did not exit within 60 seconds; terminating process tree."
              try { $probe.Kill($true); $probe.WaitForExit(10000) | Out-Null }
              catch { Write-Warning "Cleanup after timed-out self-check: $_" }
            }
            if (Test-Path -LiteralPath $env:ALTAMAM_WEBVIEW_SELFCHECK_TRACE) {
              Get-Content -LiteralPath $env:ALTAMAM_WEBVIEW_SELFCHECK_TRACE |
                ForEach-Object { Write-Host "WEBVIEW TRACE: $_" }
            } else {
              Write-Warning "WebView self-check produced no startup trace (process may have stalled before WPF startup)."
            }
            if ($exited -and $probe.ExitCode -eq 0) {
              $passed = $true
              break
            }
            if ($exited) { Write-Warning "WebView2 real navigation returned exit code $($probe.ExitCode)" }
          }
          Remove-Item Env:ALTAMAM_WEBVIEW_SELFCHECK_TRACE -ErrorAction SilentlyContinue
          if (-not $passed) { throw "WebView2 offline UI navigation failed after both bounded attempts ($env:RUNTIME)" }
          Write-Host 'WEBVIEW-SELFCHECK PASS (real Windows WebView2 navigation)'
      - name: Build Portable ZIP (clean directory, real runnable EXE)
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR\*" `
            -DestinationPath "artifacts/AlTamam-Portable-$env:DISPLAY_ARCH.zip" -Force
        shell: pwsh
        env: { }
      - name: Install Inno Setup 6 (approved tool) and compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $publishDirAbsolute = (Resolve-Path $env:PUBLISH_DIR).Path
          $architectureOption = if ($env:RUNTIME -eq 'win-x86') { '/DBuildX86' } else { '/DBuildX64' }
          & $iscc $architectureOption `
            /DAppVersion=$env:RELEASE_VERSION `
            /DPublishDir=$publishDirAbsolute `
            /DTargetArch=$env:DISPLAY_ARCH `
            build/AlTamam-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler failed' }
          Move-Item "artifacts/AlTamam-Installer-$env:DISPLAY_ARCH-setup.exe" "artifacts/AlTamam-Installer-$env:DISPLAY_ARCH.exe" -Force
      - name: Real packaged Portable vs Installer install/uninstall/reinstall and AppData preservation (15.06 automated subset)
        shell: pwsh
        run: |
          & ./build/test-package-appdata-preservation.ps1 -PortableArchive ("artifacts/AlTamam-Portable-" + $env:DISPLAY_ARCH + ".zip") -InstallerPath ("artifacts/AlTamam-Installer-" + $env:DISPLAY_ARCH + ".exe") -ExpectedArch $env:RUNTIME
          if ($LASTEXITCODE -ne 0) { throw 'Windows package preservation acceptance subset failed' }
      - name: Generate SHA-256 checksums + build metadata (15.07)
        run: python build/make-metadata.py artifacts $env:PUBLISH_DIR "$env:RELEASE_VERSION" $env:DISPLAY_ARCH
      - name: Verify bytes, checksums and exact tested commit BEFORE upload (05.12)
        shell: pwsh
        run: |
          python build/verify-release-artifacts.py artifacts $env:DISPLAY_ARCH $env:GITHUB_SHA $env:ALTAMAM_SOURCE_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw "Release package provenance or SHA-256 verification failed" }
      # One download contains ONE customer-facing version, never both.
      - name: Upload standalone Portable package for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: AlTamam-Portable-${{ matrix.arch }}-rc-${{ env.RELEASE_VERSION }}
          path: artifacts/AlTamam-Portable-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload standalone Installer package for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: AlTamam-Installer-${{ matrix.arch }}-rc-${{ env.RELEASE_VERSION }}
          path: artifacts/AlTamam-Installer-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload checksums and build metadata for ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: AlTamam-Checksums-${{ matrix.arch }}-rc-${{ env.RELEASE_VERSION }}
          path: |
            artifacts/SHA256SUMS.txt
            artifacts/BUILD_METADATA.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain raw publish dir for acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: AlTamam-publish-dir-${{ matrix.arch }}
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 30
          compression-level: 1

  clean-windows-acceptance:
    # The main branch automatically packages TESTED CANDIDATES. It is not a claim
    # of completed clean-machine acceptance; manual/tagged candidates retain that gate.
    # NEVER mark nightly/main artifacts as final released deliverables.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: Clean-machine acceptance matrix (15.06) — manual evidence gate
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with: { pattern: "AlTamam-Installer-Windows-64bit-rc-*", merge-multiple: true, path: rc }
      - name: Stage installer next to cwd
        shell: pwsh
        run: Copy-Item rc/AlTamam-Installer-Windows-64bit.exe .
      - name: Installer silent install to fresh profile
        shell: pwsh
        run: |
          # 1) first run, 2) login, 3) attendance, 4) import/export,
          # 5) shutdown/reopen, 6) upgrade-in-place, 7) uninstall keeps DB/backups,
          # 8) reinstall sees preserved data, 9) backup+restore round-trip.
          Start-Process -FilePath ".\AlTamam-Installer-Windows-64bit.exe" -ArgumentList "/VERYSILENT /DIR=C:\AlTamamTest" -Wait
          if (-not (Test-Path "C:\AlTamamTest\AlTamam.DesktopHost.exe")) { throw "installer did not lay down exe" }
      - name: Automated acceptance driver (synthetic data only)
        # §22 audit 2026-10-23: Category=Acceptance tests DO NOT EXIST in the repo yet.
        # Running `dotnet test --filter Category=Acceptance` would execute 0 tests and
        # exit 0 — a false green this contract forbids. Until Windows-UI acceptance
        # tests are authored (Phase 15 scope), this step hard-FAILS with an explicit
        # BLOCKED message instead of pretending to pass. Restore the dotnet-test form
        # only after at least one [Trait("Category","Acceptance")] test exists.
        shell: pwsh
        run: |
          $hits = Get-ChildItem tests -Recurse -Filter *.cs | Select-String -SimpleMatch 'Category","Acceptance'
          if (-not $hits) {
            throw 'BLOCKED: no Windows-UI acceptance tests exist yet (Category=Acceptance absent). This gate cannot be claimed green.'
          }
          dotnet test tests/AlTamam.Tests/AlTamam.Tests.csproj -c Release `
            --filter "Category=Acceptance" --logger "trx;LogFileName=acceptance.trx" `
            --results-directory AcceptanceResults
          if ($LASTEXITCODE -ne 0) { throw "acceptance suite failed (exit $LASTEXITCODE)" }
        continue-on-error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: AcceptanceResults/
          if-no-files-found: error
