name: Windows Release Packages (Phase 15)

# Builds the genuine WPF executable, validates the publish layout, produces BOTH
# release artifacts (Portable ZIP + Inno Setup installer), verifies runtime
# dependencies and emits SHA-256 checksums + build metadata.
# Publishing a GitHub Release is intentionally NOT done here: 15.08 requires the
# Phase 16 gate plus explicit owner approval; this workflow only uploads CI
# artifacts for review. No code signing occurs unless the owner provisions the
# approved certificate secrets (see "Optional signing" step); unsigned builds
# are never labeled 'secure'.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.15.0)'
        required: true
        default: '0.15.0'
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/windows-release.yml'
      - 'build/**'
      - 'src/AlTamam.DesktopHost/**'
      - 'src/AlTamam.Contracts/Bridge/LocalWebUiOrigin.cs'
      - 'src/AlTamam.WebUI/**'
      - 'src/AlTamam.Application/**'
      - 'src/AlTamam.Infrastructure/**'
      - 'tests/**'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  PUBLISH_DIR: publish/AlTamam-win-x64
  CONFIGURATION: Release
  RUNTIME: win-x64
  RELEASE_VERSION: ${{ github.event_name == 'pull_request' && '0.15.0-ci' || (github.event.inputs.version || github.ref_name) }}

jobs:
  preflight:
    name: Manifest & advisory preflight (15.01 / 14.01 carry-over)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Action-manifest security guard (93 actions, CSP, RBAC drift)
        run: python build/manifest-guard.py
      - name: Validate Arabic navigation and JavaScript syntax
        shell: pwsh
        run: |
          python build/validate-ui-shell.py
          if ($LASTEXITCODE -ne 0) { throw 'UI shell contract failed' }
          foreach ($file in @('altamam-app.js', 'bridge-client.js', 'screen-module.js', 'functional-screens.js', 'admin-settings.js', 'attendance-ui.js', 'personnel-movements.js', 'personnel-separation.js', 'personnel-report.js')) {
            node --check "src/AlTamam.WebUI/assets/js/$file"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $file" }
          }
      - name: Test administration drill-down and settings safeguards
        shell: pwsh
        run: |
          node build/test-admin-settings-navigation.js
          if ($LASTEXITCODE -ne 0) { throw 'Admin/settings UI regression' }
          node build/test-excel-import-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Excel personnel import UI regression' }
          node build/test-monthly-excel-export.js
          if ($LASTEXITCODE -ne 0) { throw 'Monthly native Excel UI regression' }
          node build/test-monthly-cell-details.js
          if ($LASTEXITCODE -ne 0) { throw 'Monthly cell details UI regression' }
          node build/test-attendance-drafts.js
          if ($LASTEXITCODE -ne 0) { throw 'Attendance draft UI regression' }
          node build/test-dashboard-counter-filters.js
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard counter filter UI regression' }
          node build/test-attendance-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Attendance UI smoke failed' }
          node build/test-personnel-movements.js
          if ($LASTEXITCODE -ne 0) { throw 'Admin/settings navigation regression' }
          node build/test-session-idle.js
          if ($LASTEXITCODE -ne 0) { throw '10-minute session inactivity regression' }
          node build/test-operation-dialogs.js
          if ($LASTEXITCODE -ne 0) { throw "Centered operation dialog regression" }
          node build/test-personnel-separation.js
          if ($LASTEXITCODE -ne 0) { throw 'Personnel separation UI regression' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore with package integrity + advisory audit
        shell: pwsh
        run: |
          dotnet restore AlTamam.slnx; if ($LASTEXITCODE -ne 0) { throw 'restore failed' }
          dotnet list AlTamam.slnx package --vulnerable --include-transitive | Tee-Object vulnerable.txt
          if ($LASTEXITCODE -ne 0) { throw 'vulnerability scan command failed' }
          if (Select-String -Path vulnerable.txt -SimpleMatch 'has an easily accessible vulnerability') {
            throw 'ADVISORY GATE FAILED: transitive package vulnerability present'
          }

  build-test:
    name: Build + full test suite on Windows x64 (15.01)
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore / Build
        run: |
          dotnet restore AlTamam.slnx
          dotnet build AlTamam.slnx -c $env:CONFIGURATION --no-restore
      # NOTE (2026-10-23 §22 audit): the previous category-filtered steps (--filter
      # "Category=Unit|Persistence|Security|Performance") were a SILENT NO-OP: zero test
      # files declare any Trait/Category today, so those filters matched nothing while
      # `dotnet test` still exited 0 — exactly the false-green this contract forbids.
      # Until categories are declared on the tests themselves, run the FULL suite.
      - name: Full deterministic test suite (all authored tests; unit+persistence+security+bridge+performance)
        run: >
          dotnet test tests/AlTamam.Tests/AlTamam.Tests.csproj -c $env:CONFIGURATION --no-build
          --logger "trx;LogFileName=full-suite.trx" --results-directory TestResults
      - name: Guard against zero-tests-executed (fail if trx reports 0 tests)
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults/full-suite.trx
          $xml = [xml](Get-Content $trx)
          $count = [int]$xml.TestRun.ResultSummary.Counters.total
          Write-Host "Tests executed: $count"
          if ($count -lt 1) { throw 'TEST SUITE RAN 0 TESTS — filter/project drift detected' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults/*.trx
          if-no-files-found: error

  package:
    name: Publish, validate, portable ZIP + installer (15.02-15.07)
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: Directory.Packages.props
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Stage and verify offline Cairo and Tajawal fonts
        shell: pwsh
        run: |
          ./build/prepare-offline-fonts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Offline font preparation failed' }
      - name: Publish genuine WPF executable (self-contained, win-x64)
        run: >
          dotnet publish src/AlTamam.DesktopHost/AlTamam.DesktopHost.csproj
          -c $env:CONFIGURATION -r $env:RUNTIME --self-contained true
          -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false
          -o $env:PUBLISH_DIR
      - name: Remove WebView2 XML API documentation from distribution only
        shell: pwsh
        run: |
          # Generated API reference files are not required by WebView2 at runtime.
          # Keep DLLs, native loaders, application XML assets, and all other files.
          Get-ChildItem -LiteralPath $env:PUBLISH_DIR -File -Filter 'Microsoft.Web.WebView2.*.xml' |
            Remove-Item -Force
      - name: Validate publish layout (real PE, WebView2 loader, SQLCipher native)
        run: python build/validate-layout.py $env:PUBLISH_DIR --portable
      - name: Optional signing (ONLY with owner-provisioned approved certificate)
        shell: pwsh
        env:
          SMTOOL_USER: ${{ secrets.SMTOOL_USER }}
          SMTOOL_AUTH: ${{ secrets.SMTOOL_AUTH }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            Write-Host "Signing disabled for PR validation; production signing requires owner approval."
          } elseif ($env:SMTOOL_USER) {
            # Real certificate comes exclusively from owner-approved secrets;
            # never embedded in the repository. Absent => artifact stays UNSIGNED
            # and release notes must not claim signature/'secure' distribution.
            choco install sigclient2 -y --version 2.1.0
            java -jar "$env:GITHUB_WORKSPACE/build/sigclient2.jar" `
              -user $env:SMTOOL_USER -auth $env:SMTOOL_AUTH `
              -r http://timestamp.digicert.com -td SHA-256 -fd SHA-256 `
              -in "$env:PUBLISH_DIR\AlTamam.DesktopHost.exe" `
              -sw -debug -verbose
          } else { Write-Host "SIGNING SKIPPED: no approved certificate provisioned (unsigned != secure)." }
      - name: Smoke-run headless checks on runner (15.06 partial, real machine evidence below)
        shell: pwsh
        run: |
          # Executable actually launches; WPF UI loop can't be asserted headlessly,
          # so we verify process start + clean exit via the built-in self-check flag.
          & "$env:PUBLISH_DIR\AlTamam.DesktopHost.exe" --layout-selfcheck
      - name: Verify WebView2 loads the bundled offline UI on Windows
        shell: pwsh
        run: |
          $exe = (Resolve-Path "$env:PUBLISH_DIR\AlTamam.DesktopHost.exe").Path
          $probe = Start-Process -FilePath $exe -ArgumentList '--webview-selfcheck' -PassThru
          if (-not $probe.WaitForExit(60000)) {
            $probe.Kill()
            throw 'WebView2 offline UI navigation test timed out'
          }
          if ($probe.ExitCode -ne 0) {
            throw "WebView2 offline UI navigation failed (exit $($probe.ExitCode))"
          }
          Write-Host 'WEBVIEW-SELFCHECK PASS (real Windows WebView2 navigation)'
      - name: Build Portable ZIP (clean directory, real runnable EXE)
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "$env:PUBLISH_DIR\*" `
            -DestinationPath artifacts/AlTamam-Portable-win-x64.zip -Force
        shell: pwsh
        env: { }
      - name: Install Inno Setup 6 (approved tool) and compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $publishDirAbsolute = (Resolve-Path $env:PUBLISH_DIR).Path
          & $iscc `
            /DAppVersion=$env:RELEASE_VERSION `
            /DPublishDir=$publishDirAbsolute `
            build/AlTamam-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler failed' }
          Move-Item artifacts/AlTamam-Installer-win-x64-setup.exe artifacts/AlTamam-Installer-win-x64.exe -Force
      - name: Generate SHA-256 checksums + build metadata (15.07)
        run: python build/make-metadata.py artifacts $env:PUBLISH_DIR "$env:RELEASE_VERSION"
      - name: Upload BOTH release-candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AlTamam-win-x64-rc-${{ env.RELEASE_VERSION }}
          path: |
            artifacts/AlTamam-Portable-win-x64.zip
            artifacts/AlTamam-Installer-win-x64.exe
            artifacts/SHA256SUMS.txt
            artifacts/BUILD_METADATA.json
          retention-days: 90
      - name: Retain raw publish dir for acceptance testing
        uses: actions/upload-artifact@v4
        with:
          name: AlTamam-publish-dir
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 30

  clean-windows-acceptance:
    # PRs validate build + artifacts only, never assert final release acceptance.
    # workflow_dispatch/tagged release candidates still MUST run this mandatory gate.
    if: github.event_name != 'pull_request'
    name: Clean-machine acceptance matrix (15.06) — manual evidence gate
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with: { pattern: "AlTamam-win-x64-rc-*", merge-multiple: true, path: rc }
      - name: Stage installer next to cwd
        shell: pwsh
        run: Copy-Item rc/AlTamam-Installer-win-x64.exe .
      - name: Installer silent install to fresh profile
        shell: pwsh
        run: |
          # 1) first run, 2) login, 3) attendance, 4) import/export,
          # 5) shutdown/reopen, 6) upgrade-in-place, 7) uninstall keeps DB/backups,
          # 8) reinstall sees preserved data, 9) backup+restore round-trip.
          Start-Process -FilePath ".\AlTamam-Installer-win-x64.exe" -ArgumentList "/VERYSILENT /DIR=C:\AlTamamTest" -Wait
          if (-not (Test-Path "C:\AlTamamTest\AlTamam.DesktopHost.exe")) { throw "installer did not lay down exe" }
      - name: Automated acceptance driver (synthetic data only)
        # §22 audit 2026-10-23: Category=Acceptance tests DO NOT EXIST in the repo yet.
        # Running `dotnet test --filter Category=Acceptance` would execute 0 tests and
        # exit 0 — a false green this contract forbids. Until Windows-UI acceptance
        # tests are authored (Phase 15/16 scope), this step hard-FAILS with an explicit
        # BLOCKED message instead of pretending to pass. Restore the dotnet-test form
        # only after at least one [Trait("Category","Acceptance")] test exists.
        shell: pwsh
        run: |
          $hits = Get-ChildItem tests -Recurse -Filter *.cs | Select-String -SimpleMatch 'Category","Acceptance'
          if (-not $hits) {
            throw 'BLOCKED: no Windows-UI acceptance tests exist yet (Category=Acceptance absent). This gate cannot be claimed green.'
          }
          dotnet test tests/AlTamam.Tests/AlTamam.Tests.csproj -c Release `
            --filter "Category=Acceptance" --logger "trx;LogFileName=acceptance.trx" `
            --results-directory AcceptanceResults
          if ($LASTEXITCODE -ne 0) { throw "acceptance suite failed (exit $LASTEXITCODE)" }
        continue-on-error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: AcceptanceResults/
          if-no-files-found: error
