name: Windows Core Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-contract:
    name: Manifest contract guard (69 routes / 90 actions)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Action/screen manifest security + drift guard
        run: python build/manifest-guard.py
      - name: Validate Arabic navigation and JavaScript syntax
        shell: pwsh
        run: |
          python build/validate-ui-shell.py
          if ($LASTEXITCODE -ne 0) { throw 'UI shell contract failed' }
          foreach ($file in @('altamam-app.js', 'bridge-client.js', 'screen-module.js', 'functional-screens.js', 'admin-settings.js', 'attendance-ui.js', 'personnel-movements.js', 'personnel-separation.js', 'personnel-report.js')) {
            node --check "src/AlTamam.WebUI/assets/js/$file"
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $file" }
          }
      - name: Test administration drill-down and settings safeguards
        shell: pwsh
        run: |
          node build/test-admin-settings-navigation.js
          if ($LASTEXITCODE -ne 0) { throw 'Admin/settings UI regression' }
          node build/test-monthly-cell-details.js
          if ($LASTEXITCODE -ne 0) { throw 'Monthly cell details UI regression' }
          node build/test-attendance-ui.js
          if ($LASTEXITCODE -ne 0) { throw 'Attendance UI smoke failed' }
          node build/test-attendance-drafts.js
          if ($LASTEXITCODE -ne 0) { throw 'Attendance draft UI regression' }
          node build/test-personnel-movements.js
          if ($LASTEXITCODE -ne 0) { throw 'Admin/settings navigation regression' }
          node build/test-personnel-separation.js
          if ($LASTEXITCODE -ne 0) { throw 'Personnel separation UI regression' }

  compile-core:
    needs: manifest-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore production projects
        run: dotnet restore AlTamam.slnx
      - name: Record .NET SDK version (step 01.01)
        run: |
          dotnet --list-sdks
          dotnet --version
      - name: Compile production foundation
        run: dotnet build AlTamam.slnx --configuration Release --no-restore

  core-tests:
    needs: compile-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution (production + tests)
        run: dotnet restore AlTamam.slnx
      - name: Run deterministic core tests on Windows runner (steps 01.02-01.07)
        run: >
          dotnet test tests/AlTamam.Tests/AlTamam.Tests.csproj
          --configuration Release --no-restore --logger "trx;LogFileName=core-tests.trx"
          --results-directory TestResults
      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results-windows
          path: TestResults/core-tests.trx
          if-no-files-found: error
