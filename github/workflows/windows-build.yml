name: Windows Core Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore production projects
        run: dotnet restore AlTamam.slnx
      - name: Compile production foundation
        run: dotnet build AlTamam.slnx --configuration Release --no-restore
